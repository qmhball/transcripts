<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章归档</title>
<style>
  :root { --ink:#1d1d1f; --muted:#666; --line:#e3e3e6; --accent:#0b6b5f; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:#fafafa;
         font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
         line-height:1.75; }
  .wrap { max-width:860px; margin:0 auto; padding:52px 24px 80px; }
  header { border-bottom:2px solid var(--ink); padding-bottom:20px; margin-bottom:32px; }
  h1 { margin:0 0 8px; font-size:1.9rem; letter-spacing:-.01em; }
  .intro { margin:0; color:var(--muted); }
  .posts { list-style:none; padding:0; margin:0; }
  .posts li { padding:20px 0; border-bottom:1px solid var(--line); }
  .posts a { color:var(--accent); font-size:1.15rem; font-weight:600; text-decoration:none; }
  .posts a:hover { text-decoration:underline; }
  .date { display:block; margin-top:4px; color:var(--muted); font-size:.88rem; }
  .desc { margin:8px 0 0; }
  .empty { padding:24px; background:#fff; border:1px solid var(--line); border-radius:10px; color:var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>文章归档</h1>
    <p class="intro">音视频内容整理成的文章与笔记。</p>
  </header>
  <ul class="posts">
    <li><a href="posts/2026-09-21-ai-product-evaluation.html">AI 产品评估：从失败模式到可信评估体系</a>
      <span class="date">2026-09-21 · Vivi Podcast</span>
      <p class="desc">从真实交互中归纳失败模式，再用元评估校验评估器，并把复杂系统拆成可定位的问题环节。</p></li>
  </ul>
</main>
</body>
</html>
